# Multi-tenant mode is set in the configuration with auth_enabled: true
# https://grafana.com/docs/loki/latest/operations/multi-tenancy/
auth_enabled: true

analytics:
 reporting_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info
  http_server_read_timeout: 310s # must be slightly longer than limits_config.query_timeout
  http_server_write_timeout: 310s # must be slightly longer than limits_config.query_timeout
  log_format: json

common:
  ring:
    kvstore:
      store: memberlist
  compactor_grpc_address: loki:9095
  path_prefix: /loki
  replication_factor: 1
  storage:
    s3:
      bucketnames: loki-data
      endpoint: ${LOKI_S3_ENDPOINT:-http://minio:9000}
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID:-lgtmp}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY:-supersecret}
      insecure: ${LOKI_S3_INSECURE:-true}
      s3forcepathstyle: true
      http_config:
        insecure_skip_verify: true

compactor:
  apply_retention_interval: 1h
  compaction_interval: 5m
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3
  horizontal_scaling_mode: main

memberlist:
  join_members:
  - loki-memberlist:7946

frontend:
  encoding: protobuf
  log_queries_longer_than: 5s

querier:
  multi_tenant_queries_enabled: true
  per_request_limits_enabled: true

# https://github.com/grafana/loki/blob/main/docs/sources/configure/_index.md#query_range
query_range:
  align_queries_with_step: true

  cache_results: true
  results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached:11211"

  cache_index_stats_results: true
  index_stats_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached:11211"
  cache_instant_metric_results: true

  instant_metric_query_split_align: true
  instant_metric_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached:11211"

  cache_series_results: true
  series_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached:11211"

  cache_volume_results: true
  volume_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached:11211"

pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: loki:3100

limits_config:
  split_instant_metric_queries_by_interval: '10m' # default = 1h
  metric_aggregation_enabled: true
  max_global_streams_per_user: 10000
  ingestion_rate_mb: 50000
  ingestion_burst_size_mb: 50000
  query_timeout: 300s
  volume_enabled: true

ruler:
  storage:
    type: s3
    s3:
      bucketnames: loki-ruler

runtime_config:
  file: /etc/loki/configs/runtime.yaml

schema_config:
  configs:
  - from: 2026-01-01
    index:
      prefix: loki_index_
      period: 24h
    object_store: s3
    store: tsdb
    schema: v13

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

chunk_store_config:
  chunk_cache_config:
    memcached_client:
      addresses: "dns+memcached:11211"
