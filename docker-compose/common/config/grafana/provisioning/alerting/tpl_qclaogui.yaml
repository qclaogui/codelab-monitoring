# config file version
apiVersion: 1

# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/#import-notification-template-groups

# List of templates to import or update
templates:
    - orgId: 1
      name: custom_qclaogui_email.message
      template: |
        {{ define "custom_qclaogui_email.message" }}
          Lorem ipsum - Custom alert!
        {{ end }}
    - orgId: 1
      name: custom_qclaogui_email.subject
      template: |
        {{ define "custom_qclaogui_email.subject" }}
        {{ len .Alerts.Firing }} firing alert(s), {{ len .Alerts.Resolved }} resolved alert(s)
        {{ end }}