# config file version
apiVersion: 1

# List of contact points to import or update
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/#provision-contact-points
contactPoints:
  - orgId: 1
    name: cp_qclaogui
    receivers:
      # - uid: slack_wangweifeng
      #   type: slack
      #   disableResolveMessage: false
      #   settings:
      #     url: ${SLACK_WEBHOOK_URL}
      - uid: email_qclaogui
        type: email
        disableResolveMessage: false
        settings:
          singleEmail: false
          addresses: qclaogui@example.com
          message: '{{ template "custom_qclaogui_email.message" .}}'
          subject: '{{ template "custom_qclaogui_email.subject" .}}'
      - uid: email_team_infra
        type: email
        disableResolveMessage: false
        settings:
          singleEmail: false
          addresses: qclaogui@example.com;you@example.com;me@example.com
