[log]
level = error
[log.frontend]
enabled = false
provider = grafana

[analytics]
enabled = false
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[auth]
managed_service_accounts_enabled = true
; disable_login_form = true
disable_signout_menu = true
[auth.basic]
enabled = false
[auth.anonymous]
enabled = true
org_role = Admin

[security]
disable_gravatar = true
angular_support_enabled = false

[snapshots]
enabled = false

[explore]
enabled = true

[users]
default_theme = dark

; https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/feature-toggles/#public-preview-feature-toggles
; https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#override-configuration-with-environment-variables
[feature_toggles]
grafanaAdvisor = false
; alertingListViewV2PreviewToggle = true
; pyroscopeUTF8LabelNames = true
; flameGraphWithCallTree = true
; grafana.dynamicTraceToLogs = true

; https://grafana.com/docs/grafana/latest/setup-grafana/installation/docker/#install-plugins-in-the-docker-container
; https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#plugins-1
[plugins]
enable_alpha = true
; preinstall_sync = grafana-exploretraces-app,grafana-pyroscope-app
; preinstall = grafana-exploretraces-app,grafana-pyroscope-app
preinstall_auto_update = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/docker.json
