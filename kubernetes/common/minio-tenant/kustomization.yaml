apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: minio-system

helmCharts:
- name: tenant
  repo: https://operator.min.io
  version: 7.1.1
  releaseName: tenant
  namespace: minio-system
  includeCRDs: false
  valuesFile: values-k3d-k3s.yaml
resources:
- configs/add-sm-minio.yaml
- configs/codelab-tls-certificate.yaml
# - configs/codelab-console-route.yaml
secretGenerator:
- name: user-lgtmp
  options:
    disableNameSuffixHash: true
    labels:
      v1.min.io/tenant: codelab
  literals:
  - CONSOLE_ACCESS_KEY=lgtmp
  - CONSOLE_SECRET_KEY=VD538OYxSEiGD4I9mmFfqFMCGq1vIiGm
- name: codelab-minio-env
  options:
    disableNameSuffixHash: true
    labels:
      v1.min.io/tenant: codelab
  files:
  - configs/config.env

patches:
  - target:
      kind: Tenant
      name: codelab
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: minio-system
