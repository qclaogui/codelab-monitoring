# For more information on this configuration, see the complete reference guide at
# https://grafana.com/docs/tempo/latest/configuration/

stream_over_http_enabled: true

multitenancy_enabled: true
usage_report:
  reporting_enabled: false

# Optional. Enables span profiling via otelpyroscope. When enabled, Tempo attaches pprof goroutine
# labels (span_id, span_name) to OTel spans and adds a pyroscope.profile.id attribute to root spans,
# enabling profile-to-trace correlation in Pyroscope.
# Requires OTEL_TRACES_EXPORTER, OTEL_EXPORTER_OTLP_ENDPOINT, or
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT to be set.
span_profiling: true

memberlist:
  join_members: [ tempo-memberlist:7946 ]

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: tempo-headless:4317
        http:
          endpoint: tempo-headless:4318

metrics_generator:
  processor:
    span_metrics:
      # Configure extra dimensions to add as metric labels.
      dimensions:
      - http.method
      - http.target
      - http.status_code
      - service.version
    # Service graph metrics create node and edge metrics for determinng service interactions.
    service_graphs:
      # Configure extra dimensions to add as metric labels.
      dimensions:
      - http.method
      - http.target
      - http.status_code
      - service.version
  storage:
    path: /tmp/tempo/generator/wal
    remote_write_add_org_id_header: true
    remote_write:
    - url: http://nginx.gateway.svc.cluster.local:8080/api/v1/push
      send_exemplars: true
      send_native_histograms: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

storage:
  trace:
    backend: s3
    wal:
      path: /tmp/tempo/wal
    s3:
      bucket: tempo-data
      endpoint: ${TEMPO_S3_ENDPOINT:-minio.minio-system.svc.cluster.local:443}
      access_key: ${TEMPO_S3_ACCESS_KEY:-lgtmp}
      secret_key: ${TEMPO_S3_SECRET_KEY:-supersecret}
      insecure: ${TEMPO_S3_INSECURE:-false}
      tls_insecure_skip_verify: true

# https://github.com/grafana/tempo/blob/main/docs/sources/tempo/configuration/_index.md#cache
cache:
  caches:
  - roles:
    - bloom
    - trace-id-index
    - parquet-footer
    - parquet-column-idx
    - parquet-offset-idx
    - parquet-page
    - frontend-search
    memcached:
      addresses: "dns+memcached.memcached-system.svc:11211"

overrides:
  per_tenant_override_config: /conf/overrides.yaml
  defaults:
    global:
      max_bytes_per_trace: 1500000
    metrics_generator:
      processors:
      - service-graphs
      - span-metrics
      generate_native_histograms: both

querier:
  frontend_worker:
    frontend_address: tempo:9095
