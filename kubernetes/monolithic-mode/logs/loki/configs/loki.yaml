# Multi-tenant mode is set in the configuration with auth_enabled: true
# https://grafana.com/docs/loki/latest/operations/multi-tenancy/
auth_enabled: true

analytics:
 reporting_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  http_server_read_timeout: 310s # must be slightly longer than limits_config.query_timeout
  http_server_write_timeout: 310s # must be slightly longer than limits_config.query_timeout
  log_level: info
  log_format: json
  trace_request_headers: true
  # Creates new traces for each call rather than continuing the existing trace. A
  # span link is used to allow navigation to the parent trace. Only works when
  # using Open-Telemetry tracing.
  # CLI flag: -server.create-new-traces
  create_new_traces: true

# https://grafana.com/docs/loki/latest/configure/#use-environment-variables-in-the-configuration
common:
  compactor_address: http://loki.logging-system.svc.cluster.local:3100
  path_prefix: /var/loki
  replication_factor: 1
  storage:
    s3:
      bucketnames: loki-data
      endpoint: ${LOKI_S3_ENDPOINT:-https://minio.minio-system.svc.cluster.local:443}
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID:-lgtmp}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY:-supersecret}
      insecure: ${LOKI_S3_INSECURE:-false}
      s3forcepathstyle: true
      http_config:
        insecure_skip_verify: true

bloom_gateway:
  enabled: true
  client:
    addresses: "dns+loki.logging-system.svc.cluster.local:9095"

index_gateway:
  mode: simple

compactor:
  working_directory: /var/loki/compactor
  compactor_ring:
    kvstore:
      store: memberlist

memberlist:
  join_members:
  - loki-memberlist.logging-system.svc.cluster.local:7946

# https://github.com/grafana/loki/blob/main/docs/sources/configure/_index.md#query_range
query_range:
  align_queries_with_step: true
  instant_metric_query_split_align: true

  cache_results: true
  results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"

  cache_index_stats_results: true
  index_stats_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"

  cache_instant_metric_results: true
  instant_metric_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"

  cache_series_results: true
  series_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"

  cache_volume_results: true
  volume_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"

pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: loki.logging-system.svc.cluster.local:3100

limits_config:
  split_instant_metric_queries_by_interval: '10m' # default = 1h
  metric_aggregation_enabled: true
  max_global_streams_per_user: 10000
  ingestion_rate_mb: 50000
  ingestion_burst_size_mb: 50000
  query_timeout: 300s
  volume_enabled: true

ruler:
  storage:
    s3:
      bucketnames: loki-ruler
    type: s3

runtime_config:
  file: /etc/loki/runtime-config/runtime-config.yaml

schema_config:
  configs:
  - from: 2026-08-01
    index:
      period: 24h
      prefix: loki_index_
    object_store: s3
    schema: v13
    store: tsdb

storage_config:
  tsdb_shipper:
    active_index_directory: /var/loki/index
    cache_location: /var/loki/cache
    index_gateway_client:
      server_address: "dns+loki.logging-system.svc.cluster.local:9095"

chunk_store_config:
  chunk_cache_config:
    memcached_client:
      addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"
