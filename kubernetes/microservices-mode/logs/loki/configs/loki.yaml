# Multi-tenant mode is set in the configuration with auth_enabled: true
# https://grafana.com/docs/loki/latest/operations/multi-tenancy/
auth_enabled: true

analytics:
 reporting_enabled: false

ui:
  enabled: true

server:
  graceful_shutdown_timeout: 5s
  grpc_listen_port: 9095
  grpc_server_max_concurrent_streams: 1000
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600
  grpc_server_min_time_between_pings: 10s
  grpc_server_ping_without_stream_allowed: true
  http_listen_port: 3100
  http_server_idle_timeout: 30s
  http_server_read_timeout: 10m0s
  http_server_write_timeout: 10m0s
  log_level: info
  log_format: json

bloom_build:
  enabled: true
  builder:
    planner_address: loki-distributed-bloom-planner-headless.logging-system.svc.cluster.local:9095

bloom_gateway:
  enabled: true
  client:
    # addresses: dns:///loki-distributed-bloom-gateway-headless.logging-system.svc.cluster.local:9095
    addresses: dnssrvnoa+_grpc._tcp.loki-distributed-bloom-gateway-headless.logging-system.svc.cluster.local

# https://grafana.com/docs/loki/latest/configure/#use-environment-variables-in-the-configuration
common:
  compactor_grpc_address: loki-distributed-compactor.logging-system.svc.cluster.local:9095
  path_prefix: /var/loki
  replication_factor: 3
  storage:
    s3:
      bucketnames: loki-data
      endpoint: ${LOKI_S3_ENDPOINT:-https://minio.minio-system.svc.cluster.local:443}
      access_key_id: ${LOKI_S3_ACCESS_KEY_ID:-lgtmp}
      secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY:-supersecret}
      insecure: ${LOKI_S3_INSECURE:-false}
      s3forcepathstyle: true
      http_config:
        insecure_skip_verify: true
# compactor:
#   working_directory: /var/loki/compactor
#   compactor_ring:
#     kvstore:
#       store: memberlist

frontend:
  scheduler_address: loki-distributed-query-scheduler-headless.logging-system.svc.cluster.local:9095
  tail_proxy_url: http://loki-distributed-querier.logging-system.svc.cluster.local:3100
frontend_worker:
  scheduler_address: loki-distributed-query-scheduler-headless.logging-system.svc.cluster.local:9095
index_gateway:
  mode: simple

memberlist:
  join_members:
  - loki-distributed-memberlist.logging-system.svc.cluster.local:7946

query_range:
  align_queries_with_step: true

  cache_results: true
  results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"

  cache_index_stats_results: true
  index_stats_results_cache:
    cache:
      memcached_client:
        addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"

ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist
  wal:
    dir: /var/loki/wal
    flush_on_shutdown: true

pattern_ingester:
  enabled: true

limits_config:
  max_cache_freshness_per_query: 10m
  query_timeout: 300s
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  split_queries_by_interval: 15m
  max_global_streams_per_user: 0
  ingestion_rate_mb: 50000
  ingestion_burst_size_mb: 50000
  volume_enabled: true

ruler:
  storage:
    s3:
      bucketnames: loki-ruler
    type: s3
  wal:
    dir: /var/loki/ruler-wal

runtime_config:
  file: /etc/loki/runtime-config/runtime-config.yaml

schema_config:
  configs:
  - from: "2026-08-01"
    index:
      period: 24h
      prefix: loki_index_
    object_store: s3
    schema: v13
    store: tsdb

storage_config:
  bloom_shipper:
    working_directory: /var/loki/data/bloomshipper
  tsdb_shipper:
    active_index_directory: /var/loki/index
    cache_location: /var/loki/cache
    index_gateway_client:
      # server_address: dns:///loki-distributed-index-gateway.logging-system.svc.cluster.local:9095
      server_address: dns+loki-distributed-index-gateway-headless.logging-system.svc.cluster.local:9095

chunk_store_config:
  chunk_cache_config:
    memcached_client:
      addresses: "dns+memcached.memcached-system.svc.cluster.local:11211"
