deploymentMode: Distributed

global:
  extraArgs:
  - -config.expand-env=true
  extraEnvFrom:
  - secretRef:
      name: loki-env

loki:
  configStorageType: ConfigMap
  configObjectName: loki-config
  generatedConfigObjectName: loki-config
  useTestSchema: true

  bloom_build:
    enabled: true
  bloom_gateway:
    enabled: true
  pattern_ingester:
    enabled: true
  ui:
    enabled: true
    gateway:
      enabled: true
  storage:
    bucketNames:
      chunks: loki-data
      ruler: loki-ruler
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
    storage:
      s3:
        bucketnames: loki-data
        endpoint: ${LOKI_S3_ENDPOINT:-https://minio.minio-system.svc.cluster.local:443}
        access_key_id: ${LOKI_S3_ACCESS_KEY_ID:-lgtmp}
        secret_access_key: ${LOKI_S3_SECRET_ACCESS_KEY:-supersecret}
        insecure: ${LOKI_S3_INSECURE:-false}
        s3forcepathstyle: true
        http_config:
          insecure_skip_verify: true
  tenants:
  - name: "anonymous"
    password: "anonymous"
  - name: "test-user-2"
    passwordHash: "$2y$10$7O40CaY1yz7fu9O24k2/u.ct/wELYHRBsn25v/7AyuQ8E8hrLqpva" # generated using `htpasswd -nbBC10 test-user-2 test-password-2`

test:
  enabled: false

lokiCanary:
  enabled: false

memberlist:
  service:
    publishNotReadyAddresses: true

gateway:
  enabled: true
  verboseLogging: true
  basicAuth:
    enabled: true
  route:
    main:
      enabled: true

route:
  main:
    enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false

write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

######################################################################################################################
#
# Microservices Mode
#
# For large Loki deployments ingesting more than 1 TB/day
#
######################################################################################################################
ingester:
  enabled: true
  replicas: 3
  zoneAwareReplication:
    enabled: false

distributor:
  enabled: true
  replicas: 2
  maxUnavailable: 1

querier:
  enabled: true
  replicas: 2
  maxUnavailable: 1

queryFrontend:
  enabled: true
  replicas: 1
  maxUnavailable: 1

queryScheduler:
  enabled: true
  replicas: 1

indexGateway:
  enabled: true
  replicas: 1
  maxUnavailable: 1
  persistence:
    enabled: false

compactor:
  enabled: true
  replicas: 1

bloomGateway:
  enabled: true
  replicas: 1

bloomPlanner:
  enabled: true
  replicas: 1

bloomBuilder:
  enabled: true
  replicas: 1

patternIngester:
  enabled: true
  replicas: 1

ruler:
  enabled: true
  replicas: 1
  maxUnavailable: 1

overridesExporter:
  enabled: true
  replicas: 1
